

# =====================================
# APPLICATION CONFIGURATION
# =====================================
spring.application.name=luggage_care

# =====================================
# SERVER CONFIGURATION
# =====================================
server.port=${X_ZOHO_CATALYST_LISTEN_PORT:9000}
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# =====================================
# DATABASE CONFIGURATION
# =====================================
# Zoho Catalyst Datastore
# No MySQL configuration required when using Catalyst Datastore

# =====================================
# JWT CONFIGURATION
# =====================================
app.jwt.expiration-ms=86400000

# Keep this secret in environment variables
app.jwt.secret=${JWT_SECRET}

# =====================================
# CORS CONFIGURATION
# =====================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =====================================
# LOGGING CONFIGURATION
# =====================================
logging.level.root=INFO
logging.level.com.example.demo=DEBUG

# =====================================
# JACKSON CONFIGURATION
# =====================================
spring.jackson.serialization.write-dates-as-timestamps=false

# =====================================
# ZOHO CATALYST CONFIGURATION
# =====================================
# Enable Catalyst SDK when running inside Catalyst AppSail
app.auth.catalyst-enabled=${APP_AUTH_CATALYST_ENABLED:false}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,https://inventory-management-60094424307.development.catalystserverless.in}


# catalyst.project.id=${CATALYST_PROJECT_ID:84961000000013051}
catalyst.project.domain=${CATALYST_PROJECT_DOMAIN:https://api.catalyst.zoho.in}
catalyst.environment=${CATALYST_ENVIRONMENT:Development}
catalyst.accounts-url=${CATALYST_ACCOUNTS_URL:https://accounts.zoho.in}
# catalyst.org-id=${CATALYST_ORG_ID:}
catalyst.client-id=${ZOHO_OAUTH_CLIENT_ID:}
catalyst.client-secret=${ZOHO_OAUTH_CLIENT_SECRET:}
catalyst.refresh-token=${ZOHO_OAUTH_REFRESH_TOKEN:}
# CATALYST_HOSTED_LOGIN_URL=https://inventory-management-60094424307.development.catalystserverless.in/__catalyst/auth/login
# APP_AUTH_CATALYST_ENABLED=false


# =====================================
# PUSH NOTIFICATIONS (Firebase Cloud Messaging)
# =====================================
# Zoho Creator must send this value in the X-Webhook-Secret header
notification.webhook-secret=${NOTIFICATION_WEBHOOK_SECRET:}
# Firebase service account: either the full JSON content or a file path
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
